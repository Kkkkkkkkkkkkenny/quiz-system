<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>408 考研刷题</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app quiz-layout">
    <!-- Header -->
    <header class="header">
      <button class="menu-btn" id="menuBtn" aria-label="打开目录">
        <span class="menu-btn__icon"></span>
      </button>
      <a href="home.html" class="header__logo">
        <span class="header__logo-icon">408</span>
        <span>考研学习</span>
      </a>
      <nav class="header__nav">
        <a href="home.html" class="header__nav-item">首页</a>
        <a href="index.html" class="header__nav-item active">刷题模式</a>
        <a href="notes.html" class="header__nav-item">知识点浏览</a>
      </nav>
      <div class="header__right">
        <select id="datasetSelect" class="search__input" style="max-width:220px;padding-left:12px;border-radius:var(--radius-md);background:var(--color-gray-100);border:1px solid transparent;cursor:pointer;">
          <option>加载中...</option>
        </select>
        <button class="theme-btn" id="themeBtn" aria-label="切换主题">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="theme-icon-light">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
          </svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="theme-icon-dark" style="display:none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <nav class="nav-tree" id="navTree"></nav>
    </aside>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Main Content -->
    <main class="main">
      <div class="main__content">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="quiz-card" id="quizCard">
          <div class="quiz-card__header">
            <span class="quiz-card__topic" id="topicBadge">通用</span>
            <span class="quiz-card__header-right">
              <span class="quiz-card__counter" id="counter">- / -</span>
              <button class="quiz-card__bookmark" id="bookmarkBtn" title="收藏" aria-label="收藏">&#9734;</button>
            </span>
          </div>
          <div class="quiz-card__body">
            <p class="quiz-card__question-label">问题</p>
            <p class="quiz-card__question" id="questionText">加载中...</p>
            <div class="quiz-card__divider"></div>
            <div class="quiz-card__answer" id="answerArea">
              <p class="quiz-card__answer-label">答案</p>
              <div class="quiz-card__answer-text" id="answerText"></div>
            </div>
          </div>
          <div class="quiz-card__actions">
            <button class="btn btn-primary" id="revealBtn">显示答案</button>
          </div>
        </div>

        <div class="quiz-nav">
          <button class="btn btn-secondary" id="prevBtn">上一题</button>
          <button class="btn btn-secondary" id="randomBtn">随机</button>
          <button class="btn btn-secondary" id="nextBtn">下一题</button>
        </div>

        <p class="quiz-progress-text" id="progressText"></p>
      </div>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
